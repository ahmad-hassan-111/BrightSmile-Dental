<!DOCTYPE html>

<html lang="en">

<head>

    <script>
        if (
            sessionStorage.getItem("brightSmileAdminLoggedIn") !== "true"
        ) {
            window.location.href = "login.html";
        }
    </script>


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >


    <title>BrightSmile Admin Dashboard</title>


    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


<style>


/* =========================
   RESET
========================= */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


body {

    font-family: 'Poppins', sans-serif;

    background: #f5f8fc;

    color: #222;

}


/* =========================
   HEADER
========================= */

header {

    background: white;

    padding: 20px 5%;

    box-shadow: 0 4px 20px rgba(0, 0, 0, .08);

    display: flex;

    justify-content: space-between;

    align-items: center;

}


.logo {

    font-size: 25px;

    font-weight: 700;

    color: #0d6efd;

}


.header-buttons {

    display: flex;

    gap: 10px;

    align-items: center;

}


.back-btn {

    text-decoration: none;

    background: #0d6efd;

    color: white;

    padding: 10px 20px;

    border-radius: 30px;

    font-weight: 600;

    transition: .3s;

}


.back-btn:hover {

    background: #084fc7;

}


.logout-btn {

    border: none;

    background: #dc3545;

    color: white;

    padding: 10px 20px;

    border-radius: 30px;

    font-weight: 600;

    font-family: inherit;

    cursor: pointer;

    transition: .3s;

}


.logout-btn:hover {

    background: #b02a37;

}


/* =========================
   DASHBOARD
========================= */

.dashboard {

    width: 90%;

    max-width: 1200px;

    margin: 50px auto;

}


.dashboard-title {

    margin-bottom: 30px;

}


.dashboard-title h1 {

    color: #0b2545;

    margin-bottom: 8px;

}


.dashboard-title p {

    color: #666;

}


/* =========================
   STATISTICS
========================= */

.stats {

    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 25px;

    margin-bottom: 35px;

}


.stat-card {

    background: white;

    padding: 25px;

    border-radius: 18px;

    box-shadow: 0 8px 25px rgba(0, 0, 0, .07);

}


.stat-card i {

    font-size: 25px;

    color: #0d6efd;

    margin-bottom: 15px;

}


.stat-card h2 {

    font-size: 32px;

    color: #0b2545;

}


.stat-card p {

    color: #666;

}


/* =========================
   APPOINTMENTS
========================= */

.appointments {

    background: white;

    padding: 30px;

    border-radius: 20px;

    box-shadow: 0 8px 25px rgba(0, 0, 0, .07);

}


.appointments-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 20px;

    margin-bottom: 25px;

}


.appointments-header h2 {

    color: #0b2545;

}


/* =========================
   FILTERS
========================= */

.appointment-filters {

    display: flex;

    gap: 8px;

    flex-wrap: wrap;

    margin-top: 15px;

}


.appointment-filters button {

    border: none;

    background: #eef5ff;

    color: #0d6efd;

    padding: 8px 15px;

    border-radius: 20px;

    cursor: pointer;

    font-family: inherit;

    font-weight: 600;

    transition: .3s;

}


.appointment-filters button:hover,
.appointment-filters button.active {

    background: #0d6efd;

    color: white;

}


/* =========================
   CLEAR BUTTON
========================= */

.clear-btn {

    border: none;

    background: #dc3545;

    color: white;

    padding: 10px 18px;

    border-radius: 25px;

    cursor: pointer;

    font-family: inherit;

    font-weight: 600;

    white-space: nowrap;

    transition: .3s;

}


.clear-btn:hover {

    background: #b02a37;

}


/* =========================
   TABLE
========================= */

.table-wrapper {

    overflow-x: auto;

}


table {

    width: 100%;

    border-collapse: collapse;

    min-width: 1000px;

}


th {

    background: #f1f5fb;

    color: #0b2545;

    padding: 15px;

    text-align: left;

    font-size: 14px;

}


td {

    padding: 15px;

    border-bottom: 1px solid #eee;

    color: #555;

    font-size: 14px;

}


tr:hover {

    background: #fafcff;

}


/* =========================
   STATUS
========================= */

.status-select {

    border: none;

    padding: 7px 12px;

    border-radius: 20px;

    font-family: inherit;

    font-weight: 600;

    cursor: pointer;

    outline: none;

}


.status-select:disabled {

    opacity: .6;

    cursor: wait;

}


.status-pending {

    background: #fff3cd;

    color: #856404;

}


.status-confirmed {

    background: #d1e7dd;

    color: #0f5132;

}


.status-completed {

    background: #cfe2ff;

    color: #084298;

}


/* =========================
   DELETE BUTTON
========================= */

.delete-btn {

    border: none;

    background: #ffe5e8;

    color: #dc3545;

    width: 38px;

    height: 38px;

    border-radius: 50%;

    cursor: pointer;

    transition: .3s;

}


.delete-btn:hover {

    background: #dc3545;

    color: white;

}


/* =========================
   EMPTY STATE
========================= */

.empty {

    text-align: center;

    padding: 60px 20px;

    color: #888;

}


.empty i {

    font-size: 50px;

    color: #cbd5e1;

    margin-bottom: 15px;

}


.empty h3 {

    color: #555;

    margin-bottom: 8px;

}


/* =========================
   LOADING
========================= */

.loading {

    text-align: center;

    padding: 60px 20px;

    color: #666;

}


.loading i {

    font-size: 35px;

    margin-bottom: 15px;

}


/* =========================
   ERROR
========================= */

.error-message {

    background: #ffe5e8;

    color: #842029;

    padding: 15px 20px;

    border-radius: 12px;

    margin-bottom: 20px;

    display: none;

}


/* =========================
   SUCCESS MESSAGE
========================= */

.success-message {

    position: fixed;

    top: 25px;

    right: 25px;

    background: #198754;

    color: white;

    padding: 15px 22px;

    border-radius: 12px;

    box-shadow: 0 8px 25px rgba(0,0,0,.15);

    display: none;

    z-index: 9999;

    font-weight: 600;

}


.success-message.show {

    display: block;

}


/* =========================
   MOBILE
========================= */

@media (max-width: 768px) {


    header {

        padding: 18px 4%;

        flex-direction: column;

        gap: 15px;

        align-items: flex-start;

    }


    .header-buttons {

        width: 100%;

        flex-wrap: wrap;

    }


    .logo {

        font-size: 20px;

    }


    .back-btn,
    .logout-btn {

        padding: 9px 14px;

        font-size: 13px;

    }


    .dashboard {

        width: 94%;

        margin: 35px auto;

    }


    .dashboard-title h1 {

        font-size: 28px;

    }


    .stats {

        grid-template-columns: 1fr;

    }


    .appointments {

        padding: 20px;

    }


    .appointments-header {

        flex-direction: column;

        align-items: flex-start;

    }


    .clear-btn {

        align-self: flex-start;

    }

}


</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>


    <div class="logo">

        🦷 BrightSmile Admin

    </div>


    <div class="header-buttons">


        <a
            href="index.html"
            class="back-btn"
        >

            <i class="fa-solid fa-arrow-left"></i>

            Back to Website

        </a>


        <button
            class="logout-btn"
            onclick="logoutAdmin()"
        >

            <i class="fa-solid fa-right-from-bracket"></i>

            Logout

        </button>


    </div>


</header>



<!-- =========================
     DASHBOARD
========================= -->

<main class="dashboard">


    <div class="dashboard-title">

        <h1>
            Appointment Dashboard
        </h1>

        <p>
            View and manage appointment requests submitted through the BrightSmile website.
        </p>

    </div>



    <!-- ERROR -->

    <div
        id="errorMessage"
        class="error-message"
    ></div>



    <!-- =========================
         STATISTICS
    ========================= -->

    <div class="stats">


        <div class="stat-card">

            <i class="fa-solid fa-calendar-check"></i>

            <h2 id="totalAppointments">
                0
            </h2>

            <p>
                Total Appointments
            </p>

        </div>



        <div class="stat-card">

            <i class="fa-solid fa-clock"></i>

            <h2 id="todayAppointments">
                0
            </h2>

            <p>
                Today's Appointments
            </p>

        </div>



        <div class="stat-card">

            <i class="fa-solid fa-users"></i>

            <h2 id="totalPatients">
                0
            </h2>

            <p>
                Total Patients
            </p>

        </div>


    </div>



    <!-- =========================
         APPOINTMENT SECTION
    ========================= -->

    <div class="appointments">


        <div class="appointments-header">


            <div>

                <h2>
                    Appointment Requests
                </h2>


                <div class="appointment-filters">


                    <button
                        class="filter-btn active"
                        onclick="filterAppointments('All', this)"
                    >
                        All
                    </button>


                    <button
                        class="filter-btn"
                        onclick="filterAppointments('Pending', this)"
                    >
                        Pending
                    </button>


                    <button
                        class="filter-btn"
                        onclick="filterAppointments('Confirmed', this)"
                    >
                        Confirmed
                    </button>


                    <button
                        class="filter-btn"
                        onclick="filterAppointments('Completed', this)"
                    >
                        Completed
                    </button>


                </div>

            </div>



            <button
                class="clear-btn"
                id="clearAppointments"
            >

                <i class="fa-solid fa-trash"></i>

                Clear All

            </button>


        </div>



        <!-- =========================
             TABLE
        ========================= -->

        <div id="appointmentTable">

            <div class="loading">

                <i class="fa-solid fa-spinner fa-spin"></i>

                <p>
                    Loading appointments...
                </p>

            </div>

        </div>


    </div>


</main>



<!-- =========================
     SUCCESS MESSAGE
========================= -->

<div
    id="successMessage"
    class="success-message"
></div>



<script>


// =====================================================
// BACKEND URL
// =====================================================

const API_URL = "https://bright-smile-dental-smoky.vercel.app/api";



// =====================================================
// APPOINTMENT DATA
// =====================================================

let appointments = [];

let currentFilter = "All";



// =====================================================
// LOAD DASHBOARD
// =====================================================

async function loadDashboard() {


    try {


        const response = await fetch(
            `${API_URL}/appointments`
        );


        if (!response.ok) {

            throw new Error(
                "Could not load appointments."
            );

        }


        const data = await response.json();


        appointments =
            data.appointments || [];


        updateStatistics();

        displayAppointments();


        hideError();


    }

    catch (error) {


        console.error(
            "Load appointments error:",
            error
        );


        showError(
            "Could not connect to the appointment server. Make sure the FastAPI backend is running."
        );


        appointments = [];


        updateStatistics();


        displayAppointments();

    }

}



// =====================================================
// UPDATE STATISTICS
// =====================================================

function updateStatistics() {


    const totalAppointments =
        document.getElementById(
            "totalAppointments"
        );


    const todayAppointments =
        document.getElementById(
            "todayAppointments"
        );


    const totalPatients =
        document.getElementById(
            "totalPatients"
        );



    // Total appointments

    totalAppointments.textContent =
        appointments.length;



    // Today's appointments

    const today =
        new Date()
            .toISOString()
            .split("T")[0];


    const todayCount =
        appointments.filter(
            appointment => {

                return appointment.date === today;

            }
        ).length;


    todayAppointments.textContent =
        todayCount;



    // Unique patients

    const uniquePatients =
        new Set(

            appointments.map(
                appointment =>
                    appointment.phone
            )

        );


    totalPatients.textContent =
        uniquePatients.size;

}



// =====================================================
// DISPLAY APPOINTMENTS
// =====================================================

function displayAppointments() {


    const tableContainer =
        document.getElementById(
            "appointmentTable"
        );



    let filteredAppointments =
        appointments;



    // Apply filter

    if (currentFilter !== "All") {


        filteredAppointments =
            appointments.filter(
                appointment => {

                    return (
                        appointment.status ||
                        "Pending"
                    ) === currentFilter;

                }
            );

    }



    // Empty state

    if (
        filteredAppointments.length === 0
    ) {


        tableContainer.innerHTML = `

            <div class="empty">

                <i class="fa-solid fa-calendar-xmark"></i>

                <h3>
                    No appointments found
                </h3>

                <p>
                    Appointment requests will appear here.
                </p>

            </div>

        `;


        return;

    }



    // Build table

    let tableHTML = `

        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>#</th>

                        <th>Patient</th>

                        <th>Phone</th>

                        <th>Email</th>

                        <th>Date</th>

                        <th>Time</th>

                        <th>Service</th>

                        <th>Status</th>

                        <th>Action</th>

                    </tr>

                </thead>


                <tbody>

    `;



    filteredAppointments.forEach(
        (appointment, index) => {


        const actualIndex =
            appointments.indexOf(
                appointment
            );


        const status =
            appointment.status ||
            "Pending";


        let statusClass =
            "status-pending";


        if (
            status === "Confirmed"
        ) {

            statusClass =
                "status-confirmed";

        }


        if (
            status === "Completed"
        ) {

            statusClass =
                "status-completed";

        }



        tableHTML += `

            <tr>


                <td>

                    ${index + 1}

                </td>



                <td>

                    <strong>

                        ${escapeHTML(
                            appointment.name || "-"
                        )}

                    </strong>

                </td>



                <td>

                    ${escapeHTML(
                        appointment.phone || "-"
                    )}

                </td>



                <td>

                    ${escapeHTML(
                        appointment.email || "-"
                    )}

                </td>



                <td>

                    ${escapeHTML(
                        appointment.date || "-"
                    )}

                </td>



                <td>

                    ${escapeHTML(
                        appointment.time || "-"
                    )}

                </td>



                <td>

                    ${escapeHTML(
                        appointment.service || "-"
                    )}

                </td>



                <td>


                    <select

                        class="status-select ${statusClass}"

                        onchange="
                            changeStatus(
                                ${actualIndex},
                                this.value,
                                this
                            )
                        "

                    >


                        <option

                            value="Pending"

                            ${
                                status === "Pending"
                                    ? "selected"
                                    : ""
                            }

                        >

                            Pending

                        </option>



                        <option

                            value="Confirmed"

                            ${
                                status === "Confirmed"
                                    ? "selected"
                                    : ""
                            }

                        >

                            Confirmed

                        </option>



                        <option

                            value="Completed"

                            ${
                                status === "Completed"
                                    ? "selected"
                                    : ""
                            }

                        >

                            Completed

                        </option>


                    </select>


                </td>



       


            </tr>

        `;

    });



    tableHTML += `

                </tbody>

            </table>

        </div>

    `;



    tableContainer.innerHTML =
        tableHTML;

}



// =====================================================
// FILTER APPOINTMENTS
// =====================================================

function filterAppointments(
    filter,
    button
) {


    currentFilter =
        filter;



    document
        .querySelectorAll(
            ".filter-btn"
        )
        .forEach(btn => {

            btn.classList.remove(
                "active"
            );

        });



    if (button) {

        button.classList.add(
            "active"
        );

    }



    displayAppointments();

}



// =====================================================
// CHANGE STATUS
// =====================================================

async function changeStatus(
    index,
    newStatus,
    selectElement
) {


    const appointment =
        appointments[index];


    if (!appointment) {

        return;

    }


    const oldStatus =
        appointment.status ||
        "Pending";



    // Prevent accidental duplicate requests

    selectElement.disabled = true;



    try {


        const response =
            await fetch(

                `${API_URL}/appointments/${appointment.id}/status`,

                {

                    method: "PATCH",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        status: newStatus

                    })

                }

            );



        const data =
            await response.json();



        if (!response.ok) {


            throw new Error(

                data.detail ||
                "Could not update appointment status."

            );

        }



        // Update local page data

        appointments[index] =
            data.appointment;



        updateStatistics();


        displayAppointments();



        showSuccess(
            `Appointment status changed to ${newStatus}.`
        );


    }

    catch (error) {


        console.error(
            "Status update error:",
            error
        );


        // Put dropdown back

        selectElement.value =
            oldStatus;


        showError(
            "Could not update the appointment status. Make sure the FastAPI backend is running."
        );


    }

    finally {


        selectElement.disabled =
            false;

    }

}







// =====================================================
// CLEAR ALL APPOINTMENTS
// =====================================================

document
    .getElementById(
        "clearAppointments"
    )
    .addEventListener(
        "click",
        async () => {


        if (
            appointments.length === 0
        ) {


            alert(
                "There are no appointments to clear."
            );


            return;

        }



        const confirmed =
            confirm(

                "Are you sure you want to delete ALL appointments?"

            );



        if (!confirmed) {

            return;

        }



        try {


            const response =
                await fetch(

                    `${API_URL}/appointments`,

                    {

                        method: "DELETE"

                    }

                );



            const data =
                await response.json();



            if (!response.ok) {

                throw new Error(

                    data.detail ||
                    "Could not delete appointments."

                );

            }



            appointments = [];


            updateStatistics();


            displayAppointments();


            showSuccess(
                "All appointments have been deleted."
            );


        }

        catch (error) {


            console.error(
                "Delete all error:",
                error
            );


            showError(
                "Could not delete appointments from the server."
            );

        }

    }
);



// =====================================================
// ESCAPE HTML
// Prevent HTML injection
// =====================================================

function escapeHTML(value) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =====================================================
// SHOW ERROR
// =====================================================

function showError(message) {


    const errorElement =
        document.getElementById(
            "errorMessage"
        );


    errorElement.textContent =
        message;


    errorElement.style.display =
        "block";

}



// =====================================================
// HIDE ERROR
// =====================================================

function hideError() {


    const errorElement =
        document.getElementById(
            "errorMessage"
        );


    errorElement.style.display =
        "none";

}



// =====================================================
// SHOW SUCCESS
// =====================================================

function showSuccess(message) {


    const successElement =
        document.getElementById(
            "successMessage"
        );


    successElement.textContent =
        message;


    successElement.classList.add(
        "show"
    );


    setTimeout(
        () => {

            successElement.classList.remove(
                "show"
            );

        },
        2500
    );

}



// =====================================================
// LOGOUT
// =====================================================

function logoutAdmin() {


    sessionStorage.removeItem(
        "brightSmileAdminLoggedIn"
    );


    window.location.href =
        "login.html";

}



// =====================================================
// START DASHBOARD
// =====================================================

loadDashboard();


</script>


</body>

</html>
